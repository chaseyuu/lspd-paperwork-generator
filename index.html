<!DOCTYPE html>
<html lang="tr" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Rapor Oluşturucu</title>
  <meta name="description" content="LSPD Tools: Araç El Koyma Raporu, İhlal Raporu, Field Interview Kart, Olay Raporu ve İfade Raporu oluşturucuları.">
  <link rel="icon" href="/lspd-tools/img/lspd.webp" type="image/webp">
  <script src="/lspd-tools/assets/prefs.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;500;600;700&display=swap">
  <link rel="stylesheet" href="/lspd-tools/assets/theme.css">
  <script src="/lspd-tools/assets/character-switcher.js" defer></script>
</head>
<body>
  <header class="app-header">
    <div class="app-header-inner">
      <a class="brand" href="/lspd-tools/">
        <img src="/lspd-tools/img/lspd.webp" alt="LSPD" width="46" height="44">
        <span>LSPD Tools</span>
      </a>
      <div class="char-switcher" data-settings-url="/lspd-tools/settings/"></div>
    </div>
  </header>

  <img class="watermark" src="/lspd-tools/img/lspd-seal.webp" alt="" aria-hidden="true">

  <main>
    <h1 class="page-title">Rapor Oluşturucu</h1>

    <h2 class="section-title">Genel Raporlar</h2>
    <nav class="tools cols-3" aria-label="Genel rapor türleri">
      <a class="tool" href="arac-el-koyma-raporu/">
        <span class="tool-icon" style="--icon:#4f46e5" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 17h2c.6 0 1-.4 1-1v-3c0-.9-.7-1.7-1.5-1.9C18.7 10.6 16 10 16 10s-1.3-1.4-2.2-2.3c-.5-.4-1.1-.7-1.8-.7H5c-.6 0-1.1.4-1.4.9l-1.4 2.9A3.7 3.7 0 0 0 2 12v4c0 .6.4 1 1 1h2"/><circle cx="7" cy="17" r="2"/><path d="M9 17h6"/><circle cx="17" cy="17" r="2"/></svg>
        </span>
        <span>
          <span class="tool-name">Araç El Koyma Raporu</span>
        </span>
        <svg class="tool-arrow" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14"/><path d="m12 5 7 7-7 7"/></svg>
      </a>

      <a class="tool" href="ihlal-raporu/">
        <span class="tool-icon" style="--icon:#f59e0b" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7Z"/><path d="M12 9v4"/><path d="M12 17h.01"/></svg>
        </span>
        <span>
          <span class="tool-name">İhlal Raporu</span>
        </span>
        <svg class="tool-arrow" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14"/><path d="m12 5 7 7-7 7"/></svg>
      </a>

      <a class="tool" href="field-interview-karti/">
        <span class="tool-icon" style="--icon:#0ea5e9" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h4"/><path d="M14 2v4a2 2 0 0 0 2 2h4"/><circle cx="11.5" cy="14.5" r="2.5"/><path d="M13.3 16.3 15 18"/></svg>
        </span>
        <span>
          <span class="tool-name">Field Interview Kart</span>
        </span>
        <svg class="tool-arrow" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14"/><path d="m12 5 7 7-7 7"/></svg>
      </a>

      <a class="tool" href="olay-raporu/">
        <span class="tool-icon" style="--icon:#ef4444" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7Z"/><path d="M14 2v4a2 2 0 0 0 2 2h4"/><path d="M9 13h6"/><path d="M9 17h6"/><path d="M9 9h1"/></svg>
        </span>
        <span>
          <span class="tool-name">Olay Raporu</span>
        </span>
        <svg class="tool-arrow" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14"/><path d="m12 5 7 7-7 7"/></svg>
      </a>

      <a class="tool" href="ifade-raporu/">
        <span class="tool-icon" style="--icon:#8b5cf6" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>
        </span>
        <span>
          <span class="tool-name">İfade Raporu</span>
        </span>
        <svg class="tool-arrow" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14"/><path d="m12 5 7 7-7 7"/></svg>
      </a>
    </nav>

    <hr class="section-divider">

    <h2 class="section-title">Özel Raporlar</h2>
    <nav class="tools cols-3" aria-label="Özel rapor türleri">
      <a class="tool" href="ppo-degerlendirme-raporu/" data-pin="9110">
        <span class="tool-icon" style="--icon:#facc15" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect width="18" height="11" x="3" y="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
        </span>
        <span>
          <span class="tool-name">PPO Değerlendirme Raporu</span>
        </span>
        <svg class="tool-arrow" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14"/><path d="m12 5 7 7-7 7"/></svg>
      </a>
    </nav>
  </main>

  <div class="modal-overlay" id="pin-modal" hidden>
    <section class="panel modal-box" aria-label="PIN girin">
      <div class="field">
        <label for="pin-modal-input">PIN</label>
        <input class="input" id="pin-modal-input" type="password" autocomplete="off" placeholder="PIN">
      </div>
      <p class="modal-error" id="pin-modal-error"></p>
      <div class="modal-actions">
        <button type="button" class="btn" id="pin-modal-cancel">Vazgeç</button>
        <button type="button" class="btn btn-primary" id="pin-modal-submit">Aç</button>
      </div>
    </section>
  </div>

  <script>
    (function () {
      var modal = document.getElementById('pin-modal');
      var input = document.getElementById('pin-modal-input');
      var error = document.getElementById('pin-modal-error');
      var submitBtn = document.getElementById('pin-modal-submit');
      var cancelBtn = document.getElementById('pin-modal-cancel');
      var pendingLink = null;

      document.querySelectorAll('.tool[data-pin]').forEach(function (link) {
        link.addEventListener('click', function (e) {
          e.preventDefault();
          pendingLink = link;
          error.textContent = '';
          input.value = '';
          modal.hidden = false;
          input.focus();
        });
      });

      function closeModal() {
        modal.hidden = true;
        pendingLink = null;
      }

      function trySubmit() {
        if (pendingLink && input.value === pendingLink.getAttribute('data-pin')) {
          var href = pendingLink.getAttribute('href');
          closeModal();
          window.location.href = href;
        } else {
          error.textContent = 'PIN yanlış.';
          input.select();
        }
      }

      submitBtn.addEventListener('click', trySubmit);
      cancelBtn.addEventListener('click', closeModal);
      input.addEventListener('keydown', function (e) {
        if (e.key === 'Enter') trySubmit();
      });
      input.addEventListener('input', function () {
        error.textContent = '';
      });
      modal.addEventListener('click', function (e) {
        if (e.target === modal) closeModal();
      });
      document.addEventListener('keydown', function (e) {
        if (e.key === 'Escape' && !modal.hidden) closeModal();
      });
    })();
  </script>
</body>
</html>
