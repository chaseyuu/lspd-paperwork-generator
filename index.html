<!DOCTYPE html>
<html lang="tr" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Evrak Oluşturucu</title>
  <meta name="description" content="LSPD Tools: Araç El Koyma Raporu ve İhlal Raporu oluşturucuları.">
  <link rel="icon" href="/lspd-tools/img/lspd.webp" type="image/webp">
  <script src="/lspd-tools/assets/prefs.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;500;600;700&display=swap">
  <link rel="stylesheet" href="/lspd-tools/assets/theme.css">
  <script src="/lspd-tools/assets/character-switcher.js" defer></script>
</head>
<body>
  <header class="app-header">
    <div class="app-header-inner">
      <a class="brand" href="/lspd-tools/">
        <img src="/lspd-tools/img/lspd.webp" alt="LSPD" width="46" height="44">
        <span>LSPD Tools</span>
      </a>
      <div class="char-switcher" data-settings-url="/lspd-tools/settings/"></div>
    </div>
  </header>

  <img class="watermark" src="/lspd-tools/img/lspd.webp" alt="" aria-hidden="true">

  <main>
    <h1 class="page-title">Evrak Oluşturucu</h1>
    <p class="intro">Oluşturmak istediğin evrak türünü seç.</p>

    <h2 class="section-title">Genel Evraklar</h2>
    <nav class="tools cols-3" aria-label="Evrak türleri">
      <a class="tool" href="arac-el-koyma-raporu/">
        <span class="tool-icon" style="--icon:#4f46e5" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 17h2c.6 0 1-.4 1-1v-3c0-.9-.7-1.7-1.5-1.9C18.7 10.6 16 10 16 10s-1.3-1.4-2.2-2.3c-.5-.4-1.1-.7-1.8-.7H5c-.6 0-1.1.4-1.4.9l-1.4 2.9A3.7 3.7 0 0 0 2 12v4c0 .6.4 1 1 1h2"/><circle cx="7" cy="17" r="2"/><path d="M9 17h6"/><circle cx="17" cy="17" r="2"/></svg>
        </span>
        <span>
          <span class="tool-name">Araç El Koyma Raporu</span>
          <span class="tool-desc">Araç el koyma raporu oluştur.</span>
        </span>
        <svg class="tool-arrow" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14"/><path d="m12 5 7 7-7 7"/></svg>
      </a>

      <a class="tool" href="ihlal-raporu/">
        <span class="tool-icon" style="--icon:#f59e0b" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7Z"/><path d="M12 9v4"/><path d="M12 17h.01"/></svg>
        </span>
        <span>
          <span class="tool-name">İhlal Raporu</span>
          <span class="tool-desc">Trafik dışı ihlaller için ceza raporu oluştur.</span>
        </span>
        <svg class="tool-arrow" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14"/><path d="m12 5 7 7-7 7"/></svg>
      </a>
    </nav>
  </main>
</body>
</html>
