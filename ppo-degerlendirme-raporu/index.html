<!DOCTYPE html>
<html lang="tr" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>PPO Değerlendirme Raporu</title>
  <link rel="icon" href="/lspd-tools/img/lspd.webp" type="image/webp">
  <script src="/lspd-tools/assets/prefs.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;500;600;700&display=swap">
  <link rel="stylesheet" href="/lspd-tools/assets/theme.css">
  <link rel="stylesheet" href="../assets/form.css">
  <script src="/lspd-tools/assets/character-switcher.js" defer></script>
</head>
<body>
  <header class="app-header">
    <div class="app-header-inner">
      <a class="brand" href="/lspd-tools/">
        <img src="/lspd-tools/img/lspd.webp" alt="LSPD" width="46" height="44">
        <span>LSPD Tools</span>
      </a>
      <div class="char-switcher" data-settings-url="/lspd-tools/settings/"></div>
    </div>
  </header>

  <img class="watermark" src="/lspd-tools/img/lspd.webp" alt="" aria-hidden="true">

  <main>
    <h1 class="page-title">PPO Değerlendirme Raporu</h1>
    <br>

    <div id="lock-view">
      <section class="panel" aria-labelledby="lock-title">
        <h2 id="lock-title">Bu rapor korumalıdır</h2>
        <p class="panel-desc">Devam etmek için şifreyi girin.</p>
        <div class="field" style="max-width: 320px;">
          <label for="lock-password">Şifre</label>
          <input class="input" id="lock-password" type="password" autocomplete="off" placeholder="Şifre">
        </div>
        <div class="form-actions" style="justify-content: flex-start;">
          <button type="button" class="btn btn-primary" id="lock-submit">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect width="18" height="11" x="3" y="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
            Kilidi Aç
          </button>
          <span class="status" id="lock-error" role="status" aria-live="polite" style="color: hsl(0 75% 65%);"></span>
        </div>
      </section>
    </div>

    <div id="report-view" hidden>
      <section class="panel">
        <h2>PPO Değerlendirme Raporu</h2>
        <p class="panel-desc">Bu rapor türü yakında eklenecek.</p>
      </section>
    </div>
  </main>

  <script>
    (function () {
      var PASSWORD = 'FTOPPO';
      var input = document.getElementById('lock-password');
      var btn = document.getElementById('lock-submit');
      var error = document.getElementById('lock-error');
      var lockView = document.getElementById('lock-view');
      var reportView = document.getElementById('report-view');

      function showError(text) {
        error.textContent = text;
        error.style.opacity = '1';
      }

      function tryUnlock() {
        if (input.value === PASSWORD) {
          lockView.hidden = true;
          reportView.hidden = false;
        } else {
          showError('Şifre yanlış.');
          input.select();
        }
      }

      btn.addEventListener('click', tryUnlock);
      input.addEventListener('keydown', function (e) {
        if (e.key === 'Enter') tryUnlock();
      });
      input.addEventListener('input', function () {
        error.style.opacity = '0';
      });
    })();
  </script>
</body>
</html>
